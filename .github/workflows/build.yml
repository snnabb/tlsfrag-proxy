name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the .NET Framework C# compiler
        shell: cmd
        run: |
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if not exist "%CSC%" (
            echo [x] csc.exe not found on this runner
            exit /b 1
          )
          "%CSC%" /nologo /target:winexe /platform:anycpu /optimize+ ^
            /r:System.dll /r:System.Core.dll ^
            /r:System.Windows.Forms.dll /r:System.Drawing.dll ^
            /win32icon:assets\TlsFragProxy.ico ^
            /out:TlsFragProxy.exe src\TlsFragProxy.cs
          if errorlevel 1 exit /b 1

      - name: Show artifact size
        shell: pwsh
        run: Get-Item TlsFragProxy.exe | Select-Object Name, Length, LastWriteTime | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TlsFragProxy
          path: TlsFragProxy.exe
          if-no-files-found: error

      - name: Syntax check the PowerShell port
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/src/TlsFragProxy.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs -and $errs.Count) {
            $errs | ForEach-Object { Write-Error "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "src/TlsFragProxy.ps1 parsed OK"

      - name: Syntax check the tools
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) {
              $errs | ForEach-Object { Write-Error "$($f.Name) line $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
            }
            Write-Host "$($f.Name) parsed OK"
          }
